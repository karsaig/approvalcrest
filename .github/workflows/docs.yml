name: Doc snippets

# README.md and docs/ hold the build snippets that readers paste. The CI build skips a change to
# documents only, so this workflow runs the snippet tests for such a change.
on:
  push:
    paths:
      - 'README.md'
      - 'docs/*.md'
      - '.github/workflows/docs.yml'
    branches: [ master ]
  pull_request:
    paths:
      - 'README.md'
      - 'docs/*.md'
      - '.github/workflows/docs.yml'
    branches: [ master ]

jobs:
  doc-snippets:
    name: Doc snippets on JDK 25
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'zulu'
          cache: maven
      - name: Install the artifacts that the snippets use
        run: mvn -B install -DskipTests --file pom.xml
      - name: Test the snippets
        working-directory: approvalcrest-gradle
        run: ./gradlew :doc-snippets:test --configuration-cache --warning-mode=fail
